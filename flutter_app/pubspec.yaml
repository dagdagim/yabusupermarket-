name: autoparts
description: Auto Parts Inventory & Sales Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.1.0

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^13.0.0

  # QR Code
  mobile_scanner: ^3.5.6
  qr_flutter: ^4.1.0

  # UI
  cupertino_icons: ^1.0.2
  fl_chart: ^0.66.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  badges: ^3.1.2
  intl: ^0.19.0
  fluttertoast: ^8.2.4
  lottie: ^3.0.0
  animated_text_kit: ^4.2.2

  # Socket.IO
  socket_io_client: ^2.0.3+1

  # Utils
  uuid: ^4.3.3
  path_provider: ^2.1.2
  permission_handler: ^11.2.0
  image_picker: ^1.0.7
  share_plus: ^7.2.2
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  retrofit_generator: ^8.1.0
  json_serializable: ^6.7.1
  json_annotation: ^4.8.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#1E3A5F"
  adaptive_icon_foreground: assets/images/app_icon.png
  web:
    generate: true
    image_path: assets/images/app_icon.png
    background_color: "#1E3A5F"
    theme_color: "#1E3A5F"
  windows:
    generate: true
    image_path: assets/images/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/images/app_icon.png
